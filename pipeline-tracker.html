<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline & Forecast Tracker — GeoVictoria MX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0c0c;
    --bg2: #161616;
    --bg3: #1e1e1e;
    --bg4: #252525;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #ede9e3;
    --text2: #8a8580;
    --text3: #4a4744;
    --green: #22c98a;
    --green-dim: rgba(34,201,138,0.12);
    --blue: #5aa8ff;
    --blue-dim: rgba(90,168,255,0.12);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --red: #e85555;
    --red-dim: rgba(232,85,85,0.12);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.12);
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --r: 6px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    padding: 2rem 2.5rem;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 0.5px solid var(--border);
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header-left h1 {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .header-left .sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .header-right {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    text-align: right;
  }

  /* TABS */
  .tabs-wrapper {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 2rem;
    border-bottom: 0.5px solid var(--border);
    position: relative;
  }
  .month-tabs {
    display: flex;
    gap: 0;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }
  .month-tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 9px 18px;
    border: none;
    background: transparent;
    color: var(--text3);
    font-family: var(--sans);
    font-size: 12.5px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .tab:hover { color: var(--text2); }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
    font-weight: 500;
  }
  .tab-anual {
    padding: 9px 20px;
    border: none;
    background: transparent;
    color: var(--text3);
    font-family: var(--sans);
    font-size: 12.5px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
    border-left: 0.5px solid var(--border2);
    margin-left: 8px;
    padding-left: 20px;
    letter-spacing: 0.01em;
  }
  .tab-anual:hover { color: var(--text2); }
  .tab-anual.active {
    color: var(--text);
    border-bottom-color: var(--text);
    font-weight: 500;
  }

  /* SUMMARY CARDS */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 2rem;
  }
  .summary-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--r);
    padding: 14px 16px;
  }
  .summary-card .label {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .summary-card .value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .summary-card .sub-val {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    margin-top: 3px;
  }
  .c-green { color: var(--green); }
  .c-amber { color: var(--amber); }
  .c-red { color: var(--red); }
  .c-blue { color: var(--blue); }
  .c-text { color: var(--text); }

  /* SECTION LABEL */
  .section-label {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 1.75rem 0 1rem;
  }

  /* CHANNEL ROWS */
  .channels-table {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .channel-row {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--r);
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 180px 1fr 90px 90px;
    gap: 14px;
    align-items: center;
  }
  .channel-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .channel-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .bar-wrap {
    position: relative;
    height: 6px;
    background: var(--bg4);
    border-radius: 3px;
    overflow: visible;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }
  .bar-overflow {
    position: absolute;
    top: -1px;
    height: 8px;
    border-radius: 3px;
    opacity: 0.3;
  }
  .pct-val {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    text-align: right;
  }
  .amount-val {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    text-align: right;
  }

  /* TOTALS ROW */
  .total-row {
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--r);
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 180px 1fr 90px 90px;
    gap: 14px;
    align-items: center;
    margin-top: 4px;
  }
  .total-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* QUARTERLY VIEW */
  .quarterly-view { display: none; }
  .quarterly-view.active { display: block; }
  .q-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-bottom: 2rem;
  }
  .q-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--r);
    padding: 16px;
  }
  .q-card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .q-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .q-months-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
  }
  .q-channel-row {
    display: grid;
    grid-template-columns: 1fr 70px 70px;
    gap: 8px;
    align-items: center;
    padding: 5px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .q-channel-row:last-child { border-bottom: none; }
  .q-channel-name {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .q-pct {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    text-align: right;
  }
  .q-amt {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    text-align: right;
  }
  .q-total-row {
    display: grid;
    grid-template-columns: 1fr 70px 70px;
    gap: 8px;
    align-items: center;
    padding: 8px 0 2px;
    margin-top: 4px;
    border-top: 0.5px solid var(--border2);
  }
  .q-total-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .q-section-title {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0 0 10px;
  }

  /* ANNUAL HEATMAP */
  .anual-view { display: none; }
  .anual-view.active { display: block; }
  .heatmap-section { margin-bottom: 2.5rem; }
  .heatmap-title {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
  }
  .heatmap-grid {
    overflow-x: auto;
  }
  .heatmap-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
  }
  .heatmap-table th {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 6px 8px;
    text-align: center;
    border-bottom: 0.5px solid var(--border);
    white-space: nowrap;
  }
  .heatmap-table th:first-child { text-align: left; }
  .heatmap-table td {
    padding: 7px 8px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    border-bottom: 0.5px solid var(--border);
  }
  .heatmap-table td:first-child {
    text-align: left;
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
  }
  .hm-cell {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    min-width: 44px;
  }
  .hm-na { color: var(--text3); font-size: 10px; }

  /* MONTHLY VIEW */
  .monthly-view { display: none; }
  .monthly-view.active { display: block; }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    body { padding: 1rem; }
    .channel-row, .total-row {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
    }
    .channel-row .bar-wrap, .total-row .bar-wrap {
      grid-column: 1 / -1;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Pipeline & Forecast Tracker</h1>
    <div class="sub">GeoVictoria México · 2026</div>
  </div>
  <div class="header-right" id="last-updated">—</div>
</header>

<div class="tabs-wrapper">
  <div class="month-tabs" id="monthTabs"></div>
  <button class="tab-anual" id="tabQ" onclick="showQuarterly()">Por Q</button>
  <button class="tab-anual" id="tabAnual" onclick="showAnual()">Año completo</button>
</div>

<div class="monthly-view active" id="monthlyView">
  <!-- Summary cards -->
  <div class="summary-row" id="summaryCards"></div>

  <!-- Pipeline por canal -->
  <div class="section-label">Pipeline por canal</div>
  <div class="channels-table" id="pipeChannels"></div>

  <!-- Forecast por canal -->
  <div class="section-label">Forecast por canal</div>
  <div class="channels-table" id="foreChannels"></div>
</div>

<div class="quarterly-view" id="quarterlyView">
  <div class="section-label" style="margin-top:0">Pipeline por Q — Real vs Meta por canal</div>
  <div class="q-grid" id="qPipeGrid"></div>
  <div class="section-label">Forecast por Q — Real vs Meta por canal</div>
  <div class="q-grid" id="qForeGrid"></div>
</div>

<div class="anual-view" id="anualView">
  <div class="heatmap-section">
    <div class="heatmap-title">Cumplimiento Pipeline — % vs Meta por Canal</div>
    <div class="heatmap-grid"><table class="heatmap-table" id="heatPipe"></table></div>
  </div>
  <div class="heatmap-section">
    <div class="heatmap-title">Cumplimiento Forecast — % vs Meta por Canal</div>
    <div class="heatmap-grid"><table class="heatmap-table" id="heatFore"></table></div>
  </div>
</div>

<script>
// ─── DATOS ────────────────────────────────────────────────────────────────────

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_LABEL = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

const CANALES = [
  { key: 'SDR',          label: 'SDR',                    color: '#5aa8ff' },
  { key: 'Prospeccion',  label: 'Prospección / Referidos', color: '#22c98a' },
  { key: 'Partners',     label: 'Partners',                color: '#f5a623' },
  { key: 'Google',       label: 'Google / Ads',            color: '#e85555' },
  { key: 'KAM',          label: 'KAM',                     color: '#a78bfa' },
];

// Metas pipe por canal por mes (desde Excel, filas 23-27)
const META_PIPE = {
  SDR:         [22594, 22594, 22594, 25983, 25983, 25983, 29880, 29880, 29880, 34362, 34362, 34362],
  Prospeccion: [15062, 15062, 15062, 17322, 17322, 17322, 19920, 19920, 19920, 22908, 22908, 22908],
  Partners:    [7531,  7531,  7531,  8661,  8661,  8661,  9960,  9960,  9960,  11454, 11454, 11454],
  Google:      [30125, 30125, 30125, 34643, 34643, 34643, 39840, 39840, 39840, 45816, 45816, 45816],
  KAM:         [5000,  5000,  5000,  8000,  8000,  8000,  11000, 11000, 11000, 14000, 14000, 14000],
};

// Metas forecast por canal por mes (desde Excel, filas 30-34)
const META_FORE = {
  SDR:         [1130, 1130, 1130, 1300, 1300, 1300, 1500, 1500, 1500, 1718, 1718, 1718],
  Prospeccion: [3389, 3389, 3389, 3900, 3900, 3900, 4500, 4500, 4500, 5154, 5154, 5154],
  Partners:    [2259, 2259, 2259, 2600, 2600, 2600, 3000, 3000, 3000, 3436, 3436, 3436],
  Google:      [4519, 4519, 4519, 5200, 5200, 5200, 6000, 6000, 6000, 6872, 6872, 6872],
  KAM:         [2000, 2000, 2000, 2500, 2500, 2500, 3000, 3000, 3000, 4000, 4000, 4000],
};

// Datos reales pipe por canal (filas 6-10)
const REAL_PIPE = {
  SDR:         [36335, 23400, 33000, 20582, 8329,  0, 0, 0, 0, 0, 0, 0],
  Prospeccion: [21400, 4800,  66700, 18900, 3200,  0, 0, 0, 0, 0, 0, 0],
  Partners:    [5000,  8000,  7850,  24000, 3070,  0, 0, 0, 0, 0, 0, 0],
  Google:      [19600, 46000, 20000, 54000, 11300, 0, 0, 0, 0, 0, 0, 0],
  KAM:         [1080,  1700,  8400,  14800, 1400,  0, 0, 0, 0, 0, 0, 0],
};

// Datos reales forecast por canal (filas 15-19)
const REAL_FORE = {
  SDR:         [2900, 600,  2038, 430,  0,    0, 0, 0, 0, 0, 0, 0],
  Prospeccion: [1900, 600,  1600, 2660, 2000, 0, 0, 0, 0, 0, 0, 0],
  Partners:    [0,    300,  2858, 535,  0,    0, 0, 0, 0, 0, 0, 0],
  Google:      [2000, 2700, 6250, 2100, 2300, 0, 0, 0, 0, 0, 0, 0],
  KAM:         [1200, 1400, 3900, 1800, 1400, 0, 0, 0, 0, 0, 0, 0],
};

// ─── ESTADO ───────────────────────────────────────────────────────────────────

let activeMonth = 0; // index 0-11

// ─── HELPERS ──────────────────────────────────────────────────────────────────

const fmt = (n) => n === 0 ? '—' : '$' + Math.round(n).toLocaleString('es-MX');
const pct = (real, meta) => meta > 0 ? Math.round((real / meta) * 100) : 0;

function colorForPct(p) {
  if (p === 0) return 'var(--text3)';
  if (p >= 100) return 'var(--green)';
  if (p >= 70)  return 'var(--amber)';
  return 'var(--red)';
}
function bgForPct(p) {
  if (p === 0) return 'transparent';
  if (p >= 100) return 'var(--green-dim)';
  if (p >= 70)  return 'var(--amber-dim)';
  return 'var(--red-dim)';
}

// ─── RENDER TABS ──────────────────────────────────────────────────────────────

function renderTabs() {
  const container = document.getElementById('monthTabs');
  container.innerHTML = '';
  MESES_LABEL.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === activeMonth && document.getElementById('anualView').style.display !== 'block' ? ' active' : '');
    btn.textContent = m;
    btn.onclick = () => { activeMonth = i; showMonthly(); };
    container.appendChild(btn);
  });
}

// ─── RENDER MONTHLY ───────────────────────────────────────────────────────────

function renderSummary(mi) {
  const totalPipeMeta = CANALES.reduce((s,c) => s + META_PIPE[c.key][mi], 0);
  const totalPipeReal = CANALES.reduce((s,c) => s + REAL_PIPE[c.key][mi], 0);
  const totalForeMeta = CANALES.reduce((s,c) => s + META_FORE[c.key][mi], 0);
  const totalForeReal = CANALES.reduce((s,c) => s + REAL_FORE[c.key][mi], 0);

  const pPipe = pct(totalPipeReal, totalPipeMeta);
  const pFore = pct(totalForeReal, totalForeMeta);
  const hayDatos = totalPipeReal > 0;

  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card">
      <div class="label">Pipeline Total</div>
      <div class="value ${hayDatos ? (pPipe>=100?'c-green':pPipe>=70?'c-amber':'c-red') : 'c-text'}">${hayDatos ? pPipe+'%' : '—'}</div>
      <div class="sub-val">${fmt(totalPipeReal)} / ${fmt(totalPipeMeta)}</div>
    </div>
    <div class="summary-card">
      <div class="label">Forecast Total</div>
      <div class="value ${hayDatos ? (pFore>=100?'c-green':pFore>=70?'c-amber':'c-red') : 'c-text'}">${hayDatos ? pFore+'%' : '—'}</div>
      <div class="sub-val">${fmt(totalForeReal)} / ${fmt(totalForeMeta)}</div>
    </div>
    <div class="summary-card">
      <div class="label">Gap Pipeline</div>
      <div class="value ${totalPipeReal >= totalPipeMeta ? 'c-green' : 'c-amber'}">${hayDatos ? fmt(totalPipeReal - totalPipeMeta) : '—'}</div>
      <div class="sub-val">${hayDatos ? (totalPipeReal >= totalPipeMeta ? 'sobre meta' : 'bajo meta') : 'sin datos'}</div>
    </div>
    <div class="summary-card">
      <div class="label">Gap Forecast</div>
      <div class="value ${totalForeReal >= totalForeMeta ? 'c-green' : 'c-amber'}">${hayDatos ? fmt(totalForeReal - totalForeMeta) : '—'}</div>
      <div class="sub-val">${hayDatos ? (totalForeReal >= totalForeMeta ? 'sobre meta' : 'bajo meta') : 'sin datos'}</div>
    </div>
  `;
}

function renderChannelRows(containerId, realData, metaData, mi) {
  const el = document.getElementById(containerId);
  let html = '';

  CANALES.forEach(c => {
    const real = realData[c.key][mi];
    const meta = metaData[c.key][mi];
    const p = pct(real, meta);
    const barW = real === 0 ? 0 : Math.min(p, 100);
    const overflow = p > 100;

    html += `
      <div class="channel-row">
        <div class="channel-name">
          <span class="channel-dot" style="background:${c.color}"></span>
          ${c.label}
        </div>
        <div class="bar-wrap">
          <div class="bar-fill" style="width:${barW}%;background:${c.color}"></div>
          ${overflow ? `<div class="bar-overflow" style="width:100%;background:${c.color};left:0"></div>` : ''}
        </div>
        <div class="pct-val" style="color:${real===0?'var(--text3)':colorForPct(p)}">${real===0 ? '—' : p+'%'}</div>
        <div class="amount-val">${real===0 ? fmt(meta) : fmt(real)}</div>
      </div>
    `;
  });

  // Total row
  const totalReal = CANALES.reduce((s,c) => s + realData[c.key][mi], 0);
  const totalMeta = CANALES.reduce((s,c) => s + metaData[c.key][mi], 0);
  const tp = pct(totalReal, totalMeta);
  const tw = Math.min(tp, 100);

  html += `
    <div class="total-row">
      <div class="total-label">Total</div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${totalReal===0?0:tw}%;background:${colorForPct(tp)}"></div>
      </div>
      <div class="pct-val" style="color:${totalReal===0?'var(--text3)':colorForPct(tp)}">${totalReal===0?'—':tp+'%'}</div>
      <div class="amount-val">${totalReal===0?fmt(totalMeta):fmt(totalReal)}</div>
    </div>
  `;

  el.innerHTML = html;
}

// ─── RENDER ANUAL ─────────────────────────────────────────────────────────────

function renderHeatmap(tableId, realData, metaData) {
  const table = document.getElementById(tableId);
  let html = '<thead><tr><th>Canal</th>';
  MESES_LABEL.forEach(m => { html += `<th>${m}</th>`; });
  html += '</tr></thead><tbody>';

  CANALES.forEach(c => {
    html += `<tr><td style="color:${c.color};font-weight:500">${c.label}</td>`;
    MESES.forEach((_, mi) => {
      const real = realData[c.key][mi];
      const meta = metaData[c.key][mi];
      if (real === 0) {
        html += `<td><span class="hm-na">—</span></td>`;
      } else {
        const p = pct(real, meta);
        html += `<td><span class="hm-cell" style="background:${bgForPct(p)};color:${colorForPct(p)}">${p}%</span></td>`;
      }
    });
    html += '</tr>';
  });

  // Total row
  html += '<tr style="border-top:0.5px solid var(--border2)"><td style="color:var(--text2);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em">Total</td>';
  MESES.forEach((_, mi) => {
    const real = CANALES.reduce((s,c) => s + realData[c.key][mi], 0);
    const meta = CANALES.reduce((s,c) => s + metaData[c.key][mi], 0);
    if (real === 0) {
      html += `<td><span class="hm-na">—</span></td>`;
    } else {
      const p = pct(real, meta);
      html += `<td><span class="hm-cell" style="background:${bgForPct(p)};color:${colorForPct(p)};font-weight:600">${p}%</span></td>`;
    }
  });
  html += '</tr></tbody>';
  table.innerHTML = html;
}

// ─── RENDER QUARTERLY ────────────────────────────────────────────────────────

const QUARTERS = [
  { label: 'Q1', months: [0,1,2], meses: 'Ene · Feb · Mar' },
  { label: 'Q2', months: [3,4,5], meses: 'Abr · May · Jun' },
  { label: 'Q3', months: [6,7,8], meses: 'Jul · Ago · Sep' },
  { label: 'Q4', months: [9,10,11], meses: 'Oct · Nov · Dic' },
];

function renderQGrid(containerId, realData, metaData) {
  const el = document.getElementById(containerId);
  let html = '';

  QUARTERS.forEach(q => {
    // Calcular si hay datos en este Q
    const hayDatos = q.months.some(mi => CANALES.some(c => realData[c.key][mi] > 0));

    html += `<div class="q-card">
      <div class="q-card-header">
        <span class="q-title">${q.label}</span>
        <span class="q-months-label">${q.meses}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 70px 70px;gap:8px;margin-bottom:6px">
        <div></div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-align:right;text-transform:uppercase;letter-spacing:0.08em">Cumpl.</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-align:right;text-transform:uppercase;letter-spacing:0.08em">Real</div>
      </div>`;

    CANALES.forEach(c => {
      const real = q.months.reduce((s, mi) => s + realData[c.key][mi], 0);
      const meta = q.months.reduce((s, mi) => s + metaData[c.key][mi], 0);
      const p = pct(real, meta);
      const sinDatos = real === 0;
      html += `
        <div class="q-channel-row">
          <div class="q-channel-name">
            <span class="channel-dot" style="background:${c.color}"></span>
            ${c.label}
          </div>
          <div class="q-pct" style="color:${sinDatos ? 'var(--text3)' : colorForPct(p)}">${sinDatos ? '—' : p+'%'}</div>
          <div class="q-amt">${sinDatos ? fmt(meta) : fmt(real)}</div>
        </div>`;
    });

    // Total Q
    const totalReal = q.months.reduce((s, mi) => s + CANALES.reduce((ss,c) => ss + realData[c.key][mi], 0), 0);
    const totalMeta = q.months.reduce((s, mi) => s + CANALES.reduce((ss,c) => ss + metaData[c.key][mi], 0), 0);
    const tp = pct(totalReal, totalMeta);

    html += `
      <div class="q-total-row">
        <div class="q-total-label">Total ${q.label}</div>
        <div class="q-pct" style="color:${totalReal===0?'var(--text3)':colorForPct(tp)};font-size:13px">${totalReal===0?'—':tp+'%'}</div>
        <div class="q-amt" style="font-size:11px;color:var(--text2)">${totalReal===0?fmt(totalMeta):fmt(totalReal)}</div>
      </div>
    </div>`;
  });

  el.innerHTML = html;
}

// ─── NAVEGACIÓN ──────────────────────────────────────────────────────────────────────

  function clearAllTabs() {
    document.getElementById('tabAnual').classList.remove('active');
    document.getElementById('tabQ').classList.remove('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  }

  function showMonthly() {
    document.getElementById('monthlyView').classList.add('active');
    document.getElementById('anualView').classList.remove('active');
    document.getElementById('quarterlyView').classList.remove('active');
    clearAllTabs();
    renderTabs();
    renderSummary(activeMonth);
    renderChannelRows('pipeChannels', REAL_PIPE, META_PIPE, activeMonth);
    renderChannelRows('foreChannels', REAL_FORE, META_FORE, activeMonth);
    document.querySelectorAll('.tab').forEach((t,i) => {
      t.classList.toggle('active', i === activeMonth);
    });
  }

  function showQuarterly() {
    document.getElementById('monthlyView').classList.remove('active');
    document.getElementById('anualView').classList.remove('active');
    document.getElementById('quarterlyView').classList.add('active');
    clearAllTabs();
    document.getElementById('tabQ').classList.add('active');
    renderQGrid('qPipeGrid', REAL_PIPE, META_PIPE);
    renderQGrid('qForeGrid', REAL_FORE, META_FORE);
  }

  function showAnual() {
    document.getElementById('monthlyView').classList.remove('active');
    document.getElementById('anualView').classList.add('active');
    document.getElementById('quarterlyView').classList.remove('active');
    clearAllTabs();
    document.getElementById('tabAnual').classList.add('active');
    renderHeatmap('heatPipe', REAL_PIPE, META_PIPE);
    renderHeatmap('heatFore', REAL_FORE, META_FORE);
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────────

  function init() {
    const now = new Date();
    document.getElementById('last-updated').textContent =
      'Actualizado ' + now.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
    renderTabs();
    showMonthly();
  }

  init();
</script>
